[package]
name = "rustcx-legacy"
version = "0.1.0"
edition = "2021"
description = "Cyclomatic complexity for Rust functions"
license = "MIT"

[lib]
name = "rustcx"
path = "src/lib.rs"

[[bin]]
name = "rustcx-legacy"
path = "src/main.rs"

[dependencies]
cmplx-rust = { path = "../../crates/cmplx-rust" }
proc-macro2 = { version = "1", features = ["span-locations"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"

[dev-dependencies]
serde_json = "1.0"
