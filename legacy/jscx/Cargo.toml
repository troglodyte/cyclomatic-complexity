[package]
name = "jscx"
version = "0.1.0"
edition = "2021"
description = "Cyclomatic complexity for JavaScript and TypeScript functions"
license = "MIT"

[lib]
name = "jscx"
path = "src/lib.rs"

[[bin]]
name = "jscx"
path = "src/main.rs"

[dependencies]
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

