[package]
name = "rustcx"
version = "0.1.0"
edition = "2021"
description = "Cyclomatic complexity for Rust functions"
license = "MIT"

[lib]
name = "rustcx"
path = "src/lib.rs"

[[bin]]
name = "rustcx"
path = "src/main.rs"

[dependencies]
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
